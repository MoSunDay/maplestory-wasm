services:
  # Serves the client (index.html, .js, .wasm, .css) with cross-origin isolation headers
  html-server:
    build:
      context: .
      dockerfile: docker/rust-web.Dockerfile
    command: ["web-server", "--port", "8000", "--directory", "."]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - maplestory-network
    restart: unless-stopped

  # Proxies WebSocket connections to the TCP Game Server
  ws-proxy:
    build:
      context: .
      dockerfile: docker/rust-web.Dockerfile
    command: ["ws-proxy", "--ws-port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - IS_DOCKER=true
      - WS_PROXY_LOCALHOST_TARGET=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - maplestory-network
    restart: unless-stopped

  # Serves on-demand game data (LazyFS) over WebSocket
  assets-server:
    build:
      context: .
      dockerfile: docker/rust-web.Dockerfile
    command: ["assets-server", "--port", "8765", "--directory", "."]
    environment:
      - ASSETS_CACHE_ALL_NX=${ASSETS_CACHE_ALL_NX:-false}
    ports:
      - "8765:8765"
    volumes:
      - .:/app
    networks:
      - maplestory-network
    restart: unless-stopped

  # Builder service - run with: docker-compose run --rm wasm-builder
  wasm-builder:
    container_name: wasm-builder
    build:
      context: .
      dockerfile: docker/builder.Dockerfile
    volumes:
      - .:/app
      # Persist Emscripten system library cache (zlib/freetype/etc.) between
      # one-off `docker compose run --rm wasm-builder ...` invocations.
      - emscripten-cache:/emsdk/upstream/emscripten/cache
    networks:
      - maplestory-network
    profiles: ["tools"]

networks:
  maplestory-network:
    external: true

volumes:
  emscripten-cache:
