# Cargo workspace for the Rust web services that support the WASM client:
#   web-server    - static file server with Range support (port 8000)
#   ws-proxy      - WebSocket-to-TCP game proxy (port 8080)
#   assets-server - LazyFS NX asset streaming over WebSocket (port 8765)

[workspace]
resolver = "2"
members = ["assets-server", "web-server", "ws-proxy"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
httparse = "1.10"
serde_json = "1.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Smaller, faster-to-distribute binaries for the Docker image.
strip = true
