worker_processes 8;

events {
    worker_connections 10240;
}

http {
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    access_log off;
    default_type application/octet-stream;

    server {
        listen 48562;
        listen [::]:48562 ipv6only=on;

        root /data00/maplestory-wasm-deploy/public-artifacts;
        autoindex on;
        autoindex_exact_size off;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
