<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒险岛online</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #fff;
        }

        #container {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 38%, rgba(53, 87, 135, 0.95) 0%, rgba(16, 28, 48, 0.98) 44%, #05080e 100%);
            opacity: 1;
            visibility: visible;
            transition: opacity 320ms ease, visibility 320ms ease;
        }

        #loading-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #asset-loading-screen {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 14, 24, 0.34);
            backdrop-filter: blur(7px) saturate(72%);
            -webkit-backdrop-filter: blur(7px) saturate(72%);
            opacity: 1;
            visibility: visible;
            transition: opacity 120ms ease, visibility 120ms ease;
        }

        #asset-loading-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .asset-loading-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 22px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 13px;
            background: rgba(16, 27, 45, 0.68);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.35);
            color: #fff8e8;
            font-family: inherit;
            font-size: 17px;
            letter-spacing: 0.04em;
        }

        .asset-loading-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .asset-loading-retry {
            align-self: center;
            padding: 6px 18px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            border-radius: 8px;
            background: rgba(244, 154, 53, 0.9);
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        .asset-loading-retry.is-hidden {
            display: none;
        }

        #asset-loading-screen.is-error .asset-loading-spinner {
            display: none;
        }

        .asset-loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.22);
            border-top-color: #ffd46a;
            border-radius: 50%;
            animation: loading-spin 800ms linear infinite;
        }

        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(420px, calc(100vw - 48px));
            text-align: center;
            font-family: inherit;
        }

        .loading-spinner {
            position: relative;
            width: 72px;
            height: 72px;
            margin-bottom: 24px;
            border: 4px solid rgba(255, 255, 255, 0.16);
            border-top-color: #ffd46a;
            border-right-color: #f49a35;
            border-radius: 50%;
            box-shadow: 0 0 28px rgba(244, 154, 53, 0.26);
            animation: loading-spin 900ms linear infinite;
        }

        .loading-spinner::after {
            content: '';
            position: absolute;
            inset: 19px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffe59b, #e88428);
            box-shadow: 0 0 18px rgba(255, 190, 75, 0.65);
        }

        .loading-title {
            margin: 0;
            font-size: 22px;
            font-weight: 650;
            letter-spacing: 0.04em;
            color: #fff8e8;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }

        .loading-detail {
            min-height: 22px;
            margin: 10px 0 0;
            font-size: 14px;
            line-height: 1.55;
            color: rgba(222, 232, 246, 0.78);
        }

        #loading-screen.is-error .loading-spinner {
            border-color: rgba(255, 255, 255, 0.14);
            border-top-color: #ff6b6b;
            animation: none;
        }

        #loading-screen.is-error .loading-spinner::after {
            background: #d94747;
            box-shadow: 0 0 18px rgba(217, 71, 71, 0.55);
        }

        @keyframes loading-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation-duration: 1800ms;
            }
        }

        #canvas {
            position: absolute;
            left: 50%;
            top: 0;
            border: none;
            background-color: #000;
            display: block;
            outline: none;
            cursor: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
            transform: translateX(-50%);
        }

        /* Invisible but focusable: the browser attaches its IME (pinyin, etc.)
           to this textarea and shows the candidate window next to it. */
        #ime-input {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 10;
            opacity: 0;
            border: none;
            outline: none;
            resize: none;
            overflow: hidden;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            padding: 0;
            margin: 0;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="container">
        <canvas id="canvas" tabindex="-1"></canvas>
        <textarea id="ime-input" wrap="off" autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>
    </div>

    <div id="loading-screen" role="status" aria-live="polite" data-phase="startup">
        <div class="loading-card">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p id="loading-title" class="loading-title">正在启动游戏…</p>
            <p id="loading-detail" class="loading-detail">正在准备客户端，请稍候</p>
        </div>
    </div>

    <div id="asset-loading-screen" class="is-hidden" role="status" aria-live="polite" aria-hidden="true">
        <div class="asset-loading-card">
            <div class="asset-loading-spinner" aria-hidden="true"></div>
            <div class="asset-loading-content">
                <span id="asset-loading-message">素材加载中...</span>
                <button id="asset-loading-retry" class="asset-loading-retry is-hidden" type="button">重试</button>
            </div>
        </div>
    </div>

    <script src="./wasm_loader.js"></script>
    <script src="./world_select_input.js"></script>
    <script src="./ime_input.js"></script>
    <script>
        (function () {
            const screen = document.getElementById('loading-screen');
            const title = document.getElementById('loading-title');
            const detail = document.getElementById('loading-detail');
            const shownAt = performance.now();
            let finishTimer = null;
            // Treat 45 seconds without phase or download progress as a stall.
            // Active Range transfers re-arm this timer as each chunk completes.
            const WATCHDOG_MS = 45000;
            let watchdog = null;

            function armWatchdog() {
                clearTimeout(watchdog);
                watchdog = setTimeout(function () {
                    if (!screen.classList.contains('is-hidden')
                        && !screen.classList.contains('is-error'))
                    {
                        fail('启动超时，请检查网络后刷新页面重试');
                    }
                }, WATCHDOG_MS);
            }

            function safeText(value, fallback) {
                return typeof value === 'string' && value.trim() ? value : fallback;
            }

            function setPhase(phase, message, description) {
                if (screen.classList.contains('is-error')) {
                    return;
                }
                armWatchdog();
                screen.dataset.phase = safeText(phase, 'loading');
                title.textContent = safeText(message, '正在加载游戏…');
                detail.textContent = safeText(description, '请稍候');
                console.log('[loading]', screen.dataset.phase);
            }

            function finish() {
                clearTimeout(watchdog);
                const minimumVisibleMs = 700;
                const delay = Math.max(0, minimumVisibleMs - (performance.now() - shownAt));
                clearTimeout(finishTimer);
                finishTimer = setTimeout(function () {
                    screen.dataset.phase = 'ready';
                    screen.classList.add('is-hidden');
                    screen.setAttribute('aria-hidden', 'true');
                }, delay);
            }

            function fail(message) {
                clearTimeout(finishTimer);
                clearTimeout(watchdog);
                screen.dataset.phase = 'error';
                screen.classList.remove('is-hidden');
                screen.classList.add('is-error');
                screen.removeAttribute('aria-hidden');
                title.textContent = '游戏加载失败';
                detail.textContent = safeText(message, '请刷新页面后重试');
            }

            armWatchdog();
            window.MapleWasmLoading = Object.freeze({ setPhase, finish, fail });
        })();

        (function () {
            let connectionLost = false;

            function show(message) {
                if (connectionLost) {
                    return;
                }
                connectionLost = true;
                window.alert(
                    typeof message === 'string' && message.trim()
                        ? message
                        : '连接已断开，游戏已经退出，请刷新页面重试。'
                );
            }

            function isLost() {
                return connectionLost;
            }

            window.MapleConnectionLost = Object.freeze({ show, isLost });
        })();

        (function () {
            const screen = document.getElementById('asset-loading-screen');
            const container = document.getElementById('container');
            const message = document.getElementById('asset-loading-message');
            const retryButton = document.getElementById('asset-loading-retry');
            const loads = new Map();
            let previousFocus = null;

            function render() {
                if (loads.size === 0) {
                    screen.classList.add('is-hidden');
                    screen.setAttribute('aria-hidden', 'true');
                    container.inert = false;
                    container.removeAttribute('aria-busy');
                    retryButton.classList.add('is-hidden');
                    screen.classList.remove('is-error');
                    if (previousFocus && previousFocus.isConnected && previousFocus.focus) {
                        previousFocus.focus({ preventScroll: true });
                    }
                    previousFocus = null;
                    return;
                }

                if (!previousFocus) {
                    previousFocus = document.activeElement;
                }
                const entries = Array.from(loads.values());
                const failed = entries.some(load => load.state === 'failed');
                const progress = entries.find(load => Number.isFinite(load.total) && load.total > 0);
                if (failed) {
                    message.textContent = '素材加载失败，请重试';
                } else if (progress) {
                    const completed = Math.min(progress.completed || 0, progress.total);
                    const percent = Math.floor(completed * 100 / progress.total);
                    message.textContent = (progress.message || '素材加载中...') + ' ' + percent + '%';
                } else {
                    message.textContent = entries.find(load => load.message)?.message || '素材加载中...';
                }
                retryButton.classList.toggle('is-hidden', !failed);
                screen.classList.toggle('is-error', failed);
                container.inert = true;
                container.setAttribute('aria-busy', 'true');
                screen.classList.remove('is-hidden');
                screen.removeAttribute('aria-hidden');
            }

            function begin(key, detail) {
                const value = detail && typeof detail === 'object' ? detail : {};
                loads.set(key, {
                    state: 'loading',
                    retry: null,
                    message: value.message,
                    completed: value.completed,
                    total: value.total
                });
                render();
            }

            function end(key) {
                loads.delete(key);
                render();
            }

            function fail(key, retry) {
                loads.set(key, { state: 'failed', retry });
                render();
            }

            function canInteract() {
                const startup = document.getElementById('loading-screen');
                return startup && startup.classList.contains('is-hidden') && loads.size === 0;
            }

            function isBlocking() {
                return loads.size > 0;
            }

            function has(key) {
                return loads.has(key);
            }

            retryButton.addEventListener('click', function () {
                const retries = Array.from(loads.values())
                    .filter(load => load.state === 'failed' && typeof load.retry === 'function')
                    .map(load => load.retry);
                retries.forEach(retry => retry());
            });

            window.MapleAssetLoading = Object.freeze({ begin, end, fail, canInteract, isBlocking, has });
        })();

        (function () {
            const GAME_WIDTH = 800;
            const GAME_HEIGHT = 600;

            function getViewportSize() {
                if (window.visualViewport) {
                    return {
                        width: window.visualViewport.width,
                        height: window.visualViewport.height
                    };
                }

                const root = document.documentElement;
                return {
                    width: root.clientWidth || window.innerWidth,
                    height: root.clientHeight || window.innerHeight
                };
            }

            function syncCanvasResolution(canvas) {
                if (canvas.width === GAME_WIDTH && canvas.height === GAME_HEIGHT) {
                    return;
                }

                if (typeof Module !== 'undefined' && typeof Module.setCanvasSize === 'function') {
                    Module.setCanvasSize(GAME_WIDTH, GAME_HEIGHT);
                } else {
                    canvas.width = GAME_WIDTH;
                    canvas.height = GAME_HEIGHT;
                }
            }

            function getFittedCanvasSize(viewW, viewH) {
                if (viewW * GAME_HEIGHT <= viewH * GAME_WIDTH) {
                    const width = Math.max(1, Math.floor(viewW));
                    return {
                        width,
                        height: Math.max(1, Math.floor(width * GAME_HEIGHT / GAME_WIDTH))
                    };
                }

                const height = Math.max(1, Math.floor(viewH));
                return {
                    width: Math.max(1, Math.floor(height * GAME_WIDTH / GAME_HEIGHT)),
                    height
                };
            }

            function fitCanvas() {
                const canvas = document.getElementById('canvas');
                if (!canvas) {
                    return;
                }

                // Keep the render surface fixed and only scale it with CSS.
                syncCanvasResolution(canvas);

                const viewport = getViewportSize();
                const { width, height } = getFittedCanvasSize(viewport.width, viewport.height);

                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                canvas.style.top = '0px';
            }

            window.MapleWasmUI = {
                applyScale: fitCanvas
            };

            window.addEventListener('resize', fitCanvas);
            document.addEventListener('fullscreenchange', fitCanvas);
            fitCanvas();
        })();

        MapleImeInput.install();

        Module = {
            canvas: (function () {
                let canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                canvas.addEventListener("click", function () {
                    if (window.MapleWasmIME && window.MapleWasmIME.active) {
                        return;
                    }
                    canvas.focus();
                });
                return canvas;
            })(),

            // Disable stdin to prevent annoying prompt() popups
            preRun: [function () {
                function stdin() {
                    return null; // Return null for EOF
                }
                FS.init(stdin, null, null);
            }],

            print: function (text) {
                console.log('[stdout]', text);
            },

            printErr: function (text) {
                console.error('[stderr]', text);
            },

            setStatus: function (text) {
                if (text) {
                    console.log('[status]', text);
                }
            },

            monitorRunDependencies: function (left) {
                console.log('[dependencies]', left, 'remaining');
            },

            onRuntimeInitialized: function () {
                console.log('[runtime] Initialized');
                if (window.MapleWasmUI && window.MapleWasmUI.applyScale) {
                    window.MapleWasmUI.applyScale();
                }
                if (window.MapleWorldSelectInput) {
                    window.MapleWorldSelectInput.install(Module, Module.canvas);
                }
            },

            // Function to add C++ logs - now just console
            addCppLog: function (level, message) {
                let timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
                console.log('[' + timestamp + '] [' + level + '] ' + message);
            }
        };

        console.log('[status] Downloading...');

        function failStartup(message) {
            const screen = document.getElementById('loading-screen');
            if (screen && !screen.classList.contains('is-hidden')
                && !screen.classList.contains('is-error')
                && window.MapleWasmLoading)
            {
                window.MapleWasmLoading.fail(message);
            }
        }

        window.onerror = function () {
            console.error('[post-exception status] Exception thrown, see JavaScript console');
            failStartup('客户端运行出错，请刷新页面后重试');
        };

        window.addEventListener('unhandledrejection', function (event) {
            console.error('[startup] Unhandled promise rejection:', event.reason);
            failStartup('客户端运行出错，请刷新页面后重试');
        });

        const WASM_CLIENT_URL = '../build/JourneyClient.wasm';
        const WASM_SCRIPT_URL = '../build/JourneyClient.js';

        async function loadConfig() {
            try {
                const response = await fetch('./config.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const config = await response.json();
                const lazyConfig = {};
                [
                    'AssetsServerIP', 'AssetsServerPort',
                    'MapleStoryServerIp', 'MapleStoryServerPort',
                    'ProxyIP', 'ProxyPort', 'AssetsServerProtocol'
                ].forEach(function (key) {
                    if (config && config[key] !== undefined && config[key] !== null) {
                        lazyConfig[key] = config[key];
                        console.log(`[config] Set ${key} from config.json:`, config[key]);
                    }
                });
                if (Object.keys(lazyConfig).length > 0) {
                    Module.LazyFS = Object.assign(Module.LazyFS || {}, lazyConfig);
                }
            } catch (error) {
                console.warn('[config] Could not load ./config.json, proceeding with defaults. Error:', error.message);
            }
        }

        async function downloadWasmClient() {
            if (!window.MapleWasmLoader) {
                throw new Error('WASM range loader is unavailable');
            }
            window.MapleWasmLoading.setPhase('wasm', '正在下载客户端…', '已完成 0%');
            Module.wasmBinary = await window.MapleWasmLoader.downloadWasm(WASM_CLIENT_URL, {
                onProgress: function (progress) {
                    window.MapleWasmLoading.setPhase(
                        'wasm',
                        '正在下载客户端…',
                        '已完成 ' + progress.percent + '%'
                    );
                },
                onRetry: function (retry) {
                    console.warn('[wasm] Retrying', retry.label, retry.nextAttempt, retry.error.message);
                    window.MapleWasmLoading.setPhase('wasm', '正在重试客户端下载…', '网络连接不稳定，请稍候');
                }
            });
        }

        function loadWasmScript() {
            return new Promise(function (resolve, reject) {
                const script = document.createElement('script');
                script.src = WASM_SCRIPT_URL;
                script.async = true;
                script.onload = resolve;
                script.onerror = function () {
                    reject(new Error('Failed to load ' + WASM_SCRIPT_URL));
                };
                document.body.appendChild(script);
            });
        }

        async function startClient() {
            await loadConfig();
            await downloadWasmClient();
            await loadWasmScript();
        }

        startClient().catch(function (error) {
            console.error('[startup] Client initialization failed:', error);
            failStartup('客户端下载失败，请检查网络后刷新页面重试');
        });
    </script>
</body>

</html>
