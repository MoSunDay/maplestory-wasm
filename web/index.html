<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒险岛online</title>
    <link rel="preload" href="/src/client/fonts/DroidSansFallback/DroidSansFallbackFull.ttf"
        as="font" type="font/ttf" crossorigin>
    <style>
        @font-face {
            font-family: 'Maple CJK';
            src: url('/src/client/fonts/DroidSansFallback/DroidSansFallbackFull.ttf') format('truetype');
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        #container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 38%, rgba(53, 87, 135, 0.95) 0%, rgba(16, 28, 48, 0.98) 44%, #05080e 100%);
            opacity: 1;
            visibility: visible;
            transition: opacity 320ms ease, visibility 320ms ease;
        }

        #loading-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(420px, calc(100vw - 48px));
            text-align: center;
            font-family: 'Maple CJK', sans-serif;
        }

        .loading-spinner {
            position: relative;
            width: 72px;
            height: 72px;
            margin-bottom: 24px;
            border: 4px solid rgba(255, 255, 255, 0.16);
            border-top-color: #ffd46a;
            border-right-color: #f49a35;
            border-radius: 50%;
            box-shadow: 0 0 28px rgba(244, 154, 53, 0.26);
            animation: loading-spin 900ms linear infinite;
        }

        .loading-spinner::after {
            content: '';
            position: absolute;
            inset: 19px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffe59b, #e88428);
            box-shadow: 0 0 18px rgba(255, 190, 75, 0.65);
        }

        .loading-title {
            margin: 0;
            font-size: 22px;
            font-weight: 650;
            letter-spacing: 0.04em;
            color: #fff8e8;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }

        .loading-detail {
            min-height: 22px;
            margin: 10px 0 0;
            font-size: 14px;
            line-height: 1.55;
            color: rgba(222, 232, 246, 0.78);
        }

        #loading-screen.is-error .loading-spinner {
            border-color: rgba(255, 255, 255, 0.14);
            border-top-color: #ff6b6b;
            animation: none;
        }

        #loading-screen.is-error .loading-spinner::after {
            background: #d94747;
            box-shadow: 0 0 18px rgba(217, 71, 71, 0.55);
        }

        @keyframes loading-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation-duration: 1800ms;
            }
        }

        #canvas {
            border: none;
            background-color: #000;
            display: block;
            outline: none;
            cursor: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Invisible but focusable: the browser attaches its IME (pinyin, etc.)
           to this textarea and shows the candidate window next to it. */
        #ime-input {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 10;
            opacity: 0;
            border: none;
            outline: none;
            resize: none;
            overflow: hidden;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            padding: 0;
            margin: 0;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="container">
        <canvas id="canvas" tabindex="-1"></canvas>
        <textarea id="ime-input" wrap="off" autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>
    </div>

    <div id="loading-screen" role="status" aria-live="polite" data-phase="startup">
        <div class="loading-card">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p id="loading-title" class="loading-title">正在启动游戏…</p>
            <p id="loading-detail" class="loading-detail">正在准备客户端，请稍候</p>
        </div>
    </div>

    <script>
        (function () {
            const screen = document.getElementById('loading-screen');
            const title = document.getElementById('loading-title');
            const detail = document.getElementById('loading-detail');
            const shownAt = performance.now();
            let finishTimer = null;

            function safeText(value, fallback) {
                return typeof value === 'string' && value.trim() ? value : fallback;
            }

            function setPhase(phase, message, description) {
                if (screen.classList.contains('is-error')) {
                    return;
                }
                screen.dataset.phase = safeText(phase, 'loading');
                title.textContent = safeText(message, '正在加载游戏…');
                detail.textContent = safeText(description, '请稍候');
                console.log('[loading]', screen.dataset.phase);
            }

            function finish() {
                const minimumVisibleMs = 700;
                const delay = Math.max(0, minimumVisibleMs - (performance.now() - shownAt));
                clearTimeout(finishTimer);
                finishTimer = setTimeout(function () {
                    screen.dataset.phase = 'ready';
                    screen.classList.add('is-hidden');
                    screen.setAttribute('aria-hidden', 'true');
                }, delay);
            }

            function fail(message) {
                clearTimeout(finishTimer);
                screen.dataset.phase = 'error';
                screen.classList.remove('is-hidden');
                screen.classList.add('is-error');
                screen.removeAttribute('aria-hidden');
                title.textContent = '游戏加载失败';
                detail.textContent = safeText(message, '请刷新页面后重试');
            }

            window.MapleWasmLoading = Object.freeze({ setPhase, finish, fail });
        })();

        (function () {
            const GAME_WIDTH = 800;
            const GAME_HEIGHT = 600;

            function syncCanvasResolution(canvas) {
                if (canvas.width === GAME_WIDTH && canvas.height === GAME_HEIGHT) {
                    return;
                }

                if (typeof Module !== 'undefined' && typeof Module.setCanvasSize === 'function') {
                    Module.setCanvasSize(GAME_WIDTH, GAME_HEIGHT);
                } else {
                    canvas.width = GAME_WIDTH;
                    canvas.height = GAME_HEIGHT;
                }
            }

            function getFittedCanvasSize(viewW, viewH) {
                if (viewW * GAME_HEIGHT <= viewH * GAME_WIDTH) {
                    const width = Math.max(1, Math.floor(viewW));
                    return {
                        width,
                        height: Math.max(1, Math.floor(width * GAME_HEIGHT / GAME_WIDTH))
                    };
                }

                const height = Math.max(1, Math.floor(viewH));
                return {
                    width: Math.max(1, Math.floor(height * GAME_WIDTH / GAME_HEIGHT)),
                    height
                };
            }

            function fitCanvas() {
                const canvas = document.getElementById('canvas');
                if (!canvas) {
                    return;
                }

                // Keep the render surface fixed and only scale it with CSS.
                syncCanvasResolution(canvas);

                const { width, height } = getFittedCanvasSize(window.innerWidth, window.innerHeight);

                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
            }

            window.MapleWasmUI = {
                applyScale: fitCanvas
            };

            window.addEventListener('resize', fitCanvas);
            document.addEventListener('fullscreenchange', fitCanvas);
            fitCanvas();
        })();

        (function () {
            const GAME_WIDTH = 800;
            const GAME_HEIGHT = 600;

            const ta = document.getElementById('ime-input');
            let active = false;
            let composing = false;
            let lastCompositionEnd = 0;

            // Control keys forwarded to the game instead of editing the textarea.
            const FORWARD_KEYS = { 13: true, 9: true, 27: true, 38: true, 40: true };

            function moduleReady() {
                return typeof Module !== 'undefined' && typeof Module.ccall === 'function';
            }

            function syncToGame() {
                if (!active || !moduleReady()) {
                    return;
                }
                Module.ccall('msime_input', null, ['string', 'number'], [ta.value, ta.selectionStart]);
            }

            function placeTextarea(x, y, w, h) {
                const canvas = document.getElementById('canvas');
                if (!canvas) {
                    return;
                }
                // Map game coordinates (800x600) onto the CSS-scaled canvas so
                // the IME candidate window pops up next to the in-game field.
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / GAME_WIDTH;
                const scaleY = rect.height / GAME_HEIGHT;
                ta.style.left = (rect.left + x * scaleX) + 'px';
                ta.style.top = (rect.top + y * scaleY) + 'px';
                ta.style.width = Math.max(40, w * scaleX) + 'px';
                ta.style.height = Math.max(24, h * scaleY) + 'px';
                ta.style.fontSize = Math.max(12, h * scaleY * 0.8) + 'px';
            }

            function caretFromUtf16(caretUtf16) {
                const caret = typeof caretUtf16 === 'number' ? caretUtf16 : ta.value.length;
                return Math.max(0, Math.min(caret, ta.value.length));
            }

            window.MapleWasmIME = {
                get active() {
                    return active;
                },
                onFocus: function (x, y, w, h, text, caretUtf16) {
                    placeTextarea(x, y, w, h);
                    active = true;
                    composing = false;
                    ta.value = text || '';
                    const caret = caretFromUtf16(caretUtf16);
                    ta.setSelectionRange(caret, caret);
                    ta.focus({ preventScroll: true });
                },
                onBlur: function () {
                    active = false;
                    composing = false;
                    ta.value = '';
                    // Park the textarea off-screen while inactive. Leaving it
                    // over the previously focused field would silently swallow
                    // mouse clicks meant for the canvas.
                    ta.style.left = '-9999px';
                    ta.style.top = '-9999px';
                    const canvas = document.getElementById('canvas');
                    if (canvas) {
                        canvas.focus({ preventScroll: true });
                    }
                },
                onText: function (text, caretUtf16) {
                    if (!active) {
                        return;
                    }
                    const value = text || '';
                    const caret = caretFromUtf16(caretUtf16);
                    // Skip no-op echoes: assigning the selection fires
                    // selectionchange, which would re-sync the identical text
                    // back to the game and loop forever.
                    if (ta.value === value && ta.selectionStart === caret && ta.selectionEnd === caret) {
                        return;
                    }
                    ta.value = value;
                    ta.setSelectionRange(caret, caret);
                }
            };

            ta.addEventListener('compositionstart', function () {
                composing = true;
            });

            ta.addEventListener('compositionend', function () {
                composing = false;
                lastCompositionEnd = Date.now();
                syncToGame();
            });

            ta.addEventListener('input', function () {
                // Intermediate preedit states are synced once composition ends;
                // acting on them would insert the raw pinyin letters as well.
                if (!composing) {
                    syncToGame();
                }
            });

            // Keep the game-side caret in sync when only the selection moves.
            document.addEventListener('selectionchange', function () {
                if (active && document.activeElement === ta) {
                    syncToGame();
                }
            });

            ta.addEventListener('keydown', function (event) {
                if (!active) {
                    return;
                }
                // Keys consumed by the IME (candidate choice, preedit editing)
                // must never reach the game.
                if (event.isComposing || event.keyCode === 229) {
                    return;
                }

                if (event.keyCode === 8) {
                    // GLFW's window-level handler already prevented the default
                    // backspace action, so delete the preceding codepoint here.
                    event.preventDefault();
                    event.stopPropagation();
                    const start = ta.selectionStart;
                    const end = ta.selectionEnd;
                    if (start === end) {
                        if (start === 0) {
                            return;
                        }
                        let prev = start - 1;
                        const trail = ta.value.charCodeAt(prev);
                        if (trail >= 0xDC00 && trail <= 0xDFFF && prev > 0) {
                            const lead = ta.value.charCodeAt(prev - 1);
                            if (lead >= 0xD800 && lead <= 0xDBFF) {
                                prev--;
                            }
                        }
                        ta.value = ta.value.slice(0, prev) + ta.value.slice(start);
                        ta.setSelectionRange(prev, prev);
                    } else {
                        ta.value = ta.value.slice(0, start) + ta.value.slice(end);
                        ta.setSelectionRange(start, start);
                    }
                    syncToGame();
                    return;
                }

                if (FORWARD_KEYS[event.keyCode]) {
                    // Some browsers fire a plain Enter keydown right after the
                    // IME used Enter to confirm a candidate; swallow it so the
                    // confirmation does not also submit the text.
                    if (event.keyCode === 13 && Date.now() - lastCompositionEnd < 100) {
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    event.preventDefault();
                    event.stopPropagation();
                    if (moduleReady()) {
                        Module.ccall('msime_key', null, ['number', 'number'], [event.keyCode, 1]);
                    }
                }
            }, true);

            // If the canvas click handler or the browser steals focus while the
            // game still considers the field focused, reclaim it.
            ta.addEventListener('blur', function () {
                if (active) {
                    setTimeout(function () {
                        if (active) {
                            ta.focus({ preventScroll: true });
                        }
                    }, 0);
                }
            });
        })();

        Module = {
            canvas: (function () {
                let canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                canvas.addEventListener("click", function () {
                    if (window.MapleWasmIME && window.MapleWasmIME.active) {
                        return;
                    }
                    canvas.focus();
                });
                return canvas;
            })(),

            // Disable stdin to prevent annoying prompt() popups
            preRun: [function () {
                function stdin() {
                    return null; // Return null for EOF
                }
                FS.init(stdin, null, null);
            }],

            print: function (text) {
                console.log('[stdout]', text);
            },

            printErr: function (text) {
                console.error('[stderr]', text);
            },

            setStatus: function (text) {
                if (text) {
                    console.log('[status]', text);
                }
            },

            monitorRunDependencies: function (left) {
                console.log('[dependencies]', left, 'remaining');
            },

            onRuntimeInitialized: function () {
                console.log('[runtime] Initialized');
                if (window.MapleWasmUI && window.MapleWasmUI.applyScale) {
                    window.MapleWasmUI.applyScale();
                }
            },

            // Function to add C++ logs - now just console
            addCppLog: function (level, message) {
                let timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
                console.log('[' + timestamp + '] [' + level + '] ' + message);
            }
        };

        console.log('[status] Downloading...');

        window.onerror = function (event) {
            console.error('[post-exception status] Exception thrown, see JavaScript console');
        };

        // Fetch configuration before loading the client
        fetch('/web/config.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(config => {
                if (config) {
                    let hasConfig = false;
                    const lazyConfig = {};

                    const lazyConfigKeys = [
                        'AssetsServerIP', 'AssetsServerPort',
                        'MapleStoryServerIp', 'MapleStoryServerPort',
                        'ProxyIP', 'ProxyPort', 'AssetsServerProtocol'
                    ];

                    lazyConfigKeys.forEach(key => {
                        if (config[key] !== undefined && config[key] !== null) {
                            lazyConfig[key] = config[key];
                            console.log(`[config] Set ${key} from config.json:`, config[key]);
                            hasConfig = true;
                        }
                    });

                    if (hasConfig) {
                        Module.LazyFS = Object.assign(Module.LazyFS || {}, lazyConfig);
                    }
                }
                loadWasmClient();
            })
            .catch(err => {
                console.warn('[config] Could not load /web/config.json, proceeding with defaults. Error:', err.message);
                loadWasmClient();
            });

        function loadWasmClient() {
            const script = document.createElement('script');
            script.src = '/build/JourneyClient.js';
            script.async = true;
            document.body.appendChild(script);
        }
    </script>
</body>

</html>
